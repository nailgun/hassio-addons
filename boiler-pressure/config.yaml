name: Boiler Pressure
version: '1.3.1'
slug: boiler-pressure
description: Read a boiler pressure gauge from a Home Assistant camera
url: https://github.com/nailgun/hassio-addons/tree/main/boiler-pressure
arch:
  - amd64
  - aarch64
init: false
homeassistant_api: true
services:
  - mqtt:need
options:
  camera_entity: camera.boiler_room
  interval: 60
  frame_width: 1920
  frame_height: 1080
  center_x: 1259.2
  center_y: 209.2
  angle_at_one_bar: 7.14
  angle_at_two_bars: 61.88
  scan_from: -65.0
  scan_to: 165.0
schema:
  camera_entity: str
  interval: int(15,3600)
  frame_width: int(64,4096)
  frame_height: int(64,4096)
  center_x: float(0,4096)
  center_y: float(0,4096)
  angle_at_one_bar: float(-360,360)
  angle_at_two_bars: float(-360,360)
  scan_from: float(-360,360)
  scan_to: float(-360,360)
  night_angle_at_one_bar: float(-360,360)?
  night_angle_at_two_bars: float(-360,360)?
  framing_reference_day: str?
  framing_reference_night: str?
